name: m2m
channels:
  - conda-forge
  - defaults
dependencies:
  # Pin Python version for compatibility with AllenSDK and antspyx
  - python=3.11

  # Build dependencies required by setup.py
  - cython>=0.29
  - setuptools>=65.0
  - pip>=23.0

  # Install all pip dependencies from requirements.txt
  # This avoids duplication and keeps requirements.txt as single source of truth
  - pip:
    - -r requirements.txt